<section class="home-editorial">
  <img *ngIf="section.imageUrl" [src]="section.imageUrl" [alt]="section.imageAlt || section.heading || ''" loading="lazy">
  <span class="home-kicker dark-kicker">{{ section.eyebrow }}</span>
  <h2>{{ section.heading }}</h2>
  <p>{{ section.body }}</p>
  <a class="home-cta home-cta-dark" *ngIf="section.buttonLabel" [shopBlockLink]="section.buttonPath || '/shop'" [blockCategory]="section.buttonCategory">{{ section.buttonLabel }} <span>↗</span></a>
</section>
