@if (ui.failed()) {
  <main class="connection-error" role="alert">
    <p>{{ ui.recovery().message }}</p>
    <form (submit)="$event.preventDefault(); ui.load()"><input type="submit" [attr.value]="ui.recovery().retry || null"></form>
  </main>
}
@else {
  <ng-container *ngIf="siteContent$ | async as site">
    <shop-header [site]="site" [attr.inert]="preview ? '' : null" />
    <main>
      <router-outlet />
    </main>
    <shop-footer [site]="site" [attr.inert]="preview ? '' : null" />
  </ng-container>
  <main class="content-loading" *ngIf="siteContentError">{{ ui.text('app.storefrontContentCouldNotBeLoadedPleaseRefresh') }}</main>
}
