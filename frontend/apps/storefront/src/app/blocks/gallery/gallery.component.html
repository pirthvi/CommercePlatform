<section class="gallery-block">
  @if (section.heading) { <h2>{{ section.heading }}</h2> }
  <div class="gallery-grid">
    @for (item of section.items; track item.id) {
      @if (item.imageUrl) { <figure><img [src]="item.imageUrl" [alt]="item.imageAlt || ''" loading="lazy">
        @if (item.title) { <figcaption>{{ item.title }}</figcaption> }</figure> }
    }
  </div>
</section>
